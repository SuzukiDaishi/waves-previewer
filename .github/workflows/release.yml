name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to the version in Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify third-party licence snapshot
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo test --locked --manifest-path tools/gen-licenses/Cargo.toml
          .\commands\generate_licenses.ps1
          cargo test --locked --lib licenses
          git diff --exit-code -- assets/licenses/third_party.json assets/licenses/THIRD_PARTY_NOTICES.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Configure Inno Setup commercial licence
        shell: pwsh
        env:
          INNO_SETUP_LICENSE_KEY: ${{ secrets.INNO_SETUP_LICENSE_KEY }}
        run: |
          $key = ($env:INNO_SETUP_LICENSE_KEY -replace '\s', '')
          if ([string]::IsNullOrWhiteSpace($key)) {
            Write-Warning "INNO_SETUP_LICENSE_KEY is not configured. This installer build is for non-commercial/test release use only."
            return
          }
          if ($key.Length -lt 108 -or -not $key.StartsWith('in') -or -not $key.EndsWith('no')) {
            throw "INNO_SETUP_LICENSE_KEY does not have the expected Inno Setup key format."
          }
          $path = 'HKCU:\Software\Jordan Russell\Inno Setup\License'
          New-Item -Path $path -Force | Out-Null
          New-ItemProperty -Path $path -Name LicenseKey -Value $key -PropertyType String -Force | Out-Null

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $ver = "${{ inputs.version }}"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build release binaries and installer
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          if ($ver) {
            .\commands\build_installer.ps1 -AppVersion $ver
          } else {
            .\commands\build_installer.ps1 -NoAutoVersion
          }

      - name: Locate installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path installer\out -Recurse -Filter "NeoWaves-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) {
            throw "Installer exe not found under installer\out"
          }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.installer.outputs.path }}" `
            --title "${{ github.ref_name }}" `
            --generate-notes

[package]
name = "neowaves"
version = "0.20260824.0"
edition = "2021"
default-run = "neowaves"
build = "build.rs"
description = "NeoWaves Audio List Editor"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
eframe = { version = "0.34.3", default-features = false }
egui = "0.34.3"
egui_extras = "0.34.3"
cpal = "0.17.3"
hound = "3.5"
walkdir = "2.5"
rfd = "0.17.2"
arc-swap = "1.9.1"
atomic_float = "1"
memmap2 = "0.9"
signalsmith-stretch = { path = "vendor/signalsmith-stretch" }
image = "0.25.10"
rustfft = "6"
realfft = "3"
regex = "1.12.3"
quick-xml = "0.39.4"
encoding_rs = "0.8"
rustc-hash = "2"
ndarray = "0.17"
rand = "0.9"
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "aiff", "pcm", "mp3", "isomp4", "aac", "alac", "ogg", "vorbis", "flac"] }
flacenc = { version = "0.4", default-features = false }
md-5 = "0.10"
sha2 = "0.10"
same-file = "1.0"
id3 = "1.17.0"
mp4ameta = "0.13"
mp3lame-encoder = { version = "0.2.4", optional = true }
fdk-aac = { version = "0.8", optional = true }
mp4 = "0.14"
vorbis_rs = "0.5.5"
bytes = "1.11.1"
base64 = "0.22"
csv = "1.3"
calamine = "0.35"
rubato = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
rusqlite = { version = "0.38", features = ["bundled"] }
tiny_http = "0.12"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
hf-hub = "0.4.3"
ort = { version = "=2.0.0-rc.11", features = ["download-binaries", "tls-native", "directml"] }
tokenizers = { version = "0.20.3", default-features = false, features = ["onig"] }
egui_kittest = { version = "0.34.3", optional = true, features = ["eframe"] }
clack-host = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744", package = "clack-host", optional = true }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "f874e858ad576c601367b3038af5088a4e671744", package = "clack-extensions", optional = true, features = ["clack-host", "gui", "params", "state"] }
vst3 = { version = "0.3.0", optional = true }
# Cross-platform H.264 decoder for the editor's video preview. Builds Cisco's
# OpenH264 from the bundled C++ sources via `cc`, which picks up the dynamic
# CRT on MSVC like every other native dep here (see build.rs). Optional so a
# build that does not want the C++ compile can drop it; on Windows the Media
# Foundation backend covers the same ground with more codecs.
openh264 = { version = "0.9", optional = true }
libloading = { version = "0.9.0", optional = true }

[features]
# `video` is deliberately NOT in the default set. The `openh264` crate compiles
# Cisco's H.264 sources with `cc`, and Cisco only pays the AVC patent pool on
# behalf of users of *their* prebuilt binaries -- a self-compiled OpenH264 puts
# that obligation on whoever ships the result. The only binary this project
# releases is the Windows installer, and `video::open_video_decoder` tries
# Media Foundation first there (H.264, HEVC, VP9, hardware accelerated), so
# leaving it out costs the release nothing. Build with `--features video` to get
# the picture back on Linux/macOS.
default = ["glow", "plugin_native_vst3", "plugin_native_clap", "aac_fdk", "mp3_lame"]
glow = ["eframe/glow", "eframe/x11", "eframe/wayland"]
wgpu = ["eframe/wgpu", "eframe/x11", "eframe/wayland"]
kittest = ["egui_kittest"]
kittest_render = ["kittest", "egui_kittest/wgpu"]
plugin_native_vst3 = ["vst3", "libloading"]
plugin_native_clap = ["clack-host", "clack-extensions"]
# Video frame preview through the bundled OpenH264. Without it a video file
# still lists, decodes its audio and plays; only the picture in the mini meter
# and the first-frame thumbnail go away (on Windows, Media Foundation still
# supplies both). Off by default -- see the note on `default` above.
video = ["openh264"]
# AAC decode fast path and M4A/AAC export via Fraunhofer's FDK. Dropping it
# leaves AAC *decoding* intact -- `audio_io` falls through to symphonia's
# pure-Rust decoder -- and removes only the encoder. The FDK licence grants no
# patent rights, and it is GPL-incompatible, so a build that ever needs to
# combine with GPL code has to turn this off.
aac_fdk = ["fdk-aac"]
# MP3 export via LAME. The crate is LGPL-3.0, so the linked binary is a
# Combined Work under LGPL-3.0 section 4 rather than plain MIT; NeoWaves
# satisfies that by publishing all of its own source. Turn it off for a build
# with no copyleft in it at all (MP3 *decoding* is symphonia's and stays).
mp3_lame = ["mp3lame-encoder"]

[profile.release]
# Thin LTO gives a measurable frame-time win for the per-sample render loops
# at a modest build-time cost.
lto = "thin"

[profile.dev]
# The WORLD analysis/synthesis and FFT paths are unusably slow at opt-level
# 0 (10-20x); light optimization keeps `cargo run` interactive while
# preserving debug assertions and usable backtraces.
opt-level = 1

# Hot DSP dependencies get full optimization even in dev builds.
# (fdk-aac-sys additionally fails to compile at -O1: its force-inlined
# fixed-point FFT needs the optimizer to devirtualize indirect calls.)
[profile.dev.package.fdk-aac-sys]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.signalsmith-stretch]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
# OpenH264 is C++ compiled without assembly optimisations here; at the crate
# default it decodes far too slowly to keep a 30 fps preview panel fed.
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3

[build-dependencies]
windows_exe_info = "0.5.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
drag = "2.1.1"
# Mirrors the normalization `drag` performs internally, so the payload can be
# checked for shell-hostile verbatim paths before handing it over.
dunce = "1.0.5"
# Media Foundation for the video preview: the OS decoder covers H.264, HEVC,
# VP9 and whatever else is installed, with hardware acceleration, where the
# bundled OpenH264 only does H.264. `windows` rather than `windows-sys`
# because Media Foundation is COM and needs the interface wrappers.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
